name: kivy-ios

on: [push, pull_request]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kivy-ios
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: ruff check
      run: ruff check kivy_ios tests
    - name: ruff format --check
      run: ruff format --check kivy_ios tests

  package:
    name: Package (build + twine)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kivy-ios
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip build twine
    - name: Build sdist and wheel
      run: python -m build
    - name: Twine check
      run: twine check dist/*

  unit_tests:
    name: Unit tests (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
    - name: Checkout kivy-ios
      uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install kivy-ios and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run pytest with coverage
      run: |
        pytest --cov=kivy_ios --cov-report=term-missing --cov-report=xml

  # macOS integration: the full suite runs here too (pbxproj generation and
  # xcodebuild/simctl command construction get real-macOS coverage). The live
  # `toolchain build --simulator` / `toolchain run` smoke test against a
  # pure-Python app on the BeeWare runtime is wired in once the iOS
  # Python.xcframework + wheels are published (spec 03/04).
  macos_integration:
    name: Integration (macOS)
    runs-on: macos-latest
    steps:
    - name: Checkout kivy-ios
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install kivy-ios and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run pytest
      run: pytest -q
